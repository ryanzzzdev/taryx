apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: worker, taryx.dev/client: aurora}}
spec:
  replicas: 1
  selector: {matchLabels: {taryx.dev/role: worker, taryx.dev/client: aurora}}
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: worker, taryx.dev/client: aurora}}
    spec:
      # Celery warm-shutdown window for graceful termination evidence.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-migrated
          image: taryx-app:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do sleep 3; done"]
          envFrom: [{configMapRef: {name: taryx-env-aurora}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-db-pass}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
      containers:
        - name: worker
          image: taryx-app:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "taryx.config.celery:app", "worker", "-B", "--loglevel=INFO", "--without-gossip", "--without-mingle", "--without-heartbeat"]
          envFrom: [{configMapRef: {name: taryx-env-aurora}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-db-pass}}
            - name: POSTGRES_SHADOW_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-shadow-pass}}
            - name: CELERY_BROKER_URL
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-amqp-url}}
            - name: MARKET_TOKEN
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-market-token}}
            - name: MARKET_CALLBACK_TOKEN
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-market-token}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
