# Applies the client-role/database grants idempotently (initdb.d only
# runs on a fresh PVC; this Job covers existing volumes too).
apiVersion: batch/v1
kind: Job
metadata: {name: db-init, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job}}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job}}
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:18.6
          command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /init/02-clients.sql"]
          env:
            - {name: PGHOST, value: db}
            - {name: PGDATABASE, value: taryx}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: db-super-user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: db-super-pass}}
          volumeMounts: [{name: init, mountPath: /init}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: init
          configMap: {name: taryx-db-init}
---
# Broker vhost/user provisioning through the management API (upsert PUTs).
apiVersion: batch/v1
kind: Job
metadata: {name: broker-provision, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job}}
spec:
  backoffLimit: 5
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job, taryx.dev/job: broker-provision}}
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: python:3.14-slim
          command: ["python", "/init/provision.py"]
          env:
            - {name: BROKER_API, value: "http://broker:15672"}
            - name: BROKER_USER
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: broker-admin-user}}
            - name: BROKER_PASS
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: broker-admin-pass}}
          volumeMounts: [{name: init, mountPath: /init}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: init
          configMap: {name: taryx-broker-init}
---
# Schema + deterministic seed for the aurora client. Application pods
# gate on `migrate --check`, so they cannot run ahead of this Job.
apiVersion: batch/v1
kind: Job
metadata: {name: migrate-aurora, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job}}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: job}}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: taryx-app:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python manage.py migrate --no-input && python manage.py seed_client"]
          envFrom: [{configMapRef: {name: taryx-env-aurora}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-db-pass}}
            - name: POSTGRES_SHADOW_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-shadow-pass}}
            - name: CELERY_BROKER_URL
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-amqp-url}}
            - name: MARKET_TOKEN
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-market-token}}
            - name: MARKET_CALLBACK_TOKEN
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: aurora-market-token}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
