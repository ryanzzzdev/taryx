# Counterparty simulators — synthetic state only, so /data is an
# explicit emptyDir (ephemeral by design: a pod restart resets the sim,
# which is the documented reset boundary; durable state lives in
# postgres/rabbitmq PVCs).
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: sim}}
spec:
  replicas: 1
  selector: {matchLabels: {taryx.dev/role: sim, taryx.dev/sim: legacy}}
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: sim, taryx.dev/sim: legacy}}
    spec:
      containers:
        - name: sim
          image: taryx-legacy-sim:latest
          imagePullPolicy: IfNotPresent
          env: [{name: LEGACY_DB, value: /data/legacy_calc.db}]
          ports: [{containerPort: 8090}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8090}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: legacy, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx}}
spec:
  selector: {taryx.dev/sim: legacy}
  ports: [{port: 8090, targetPort: 8090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy-sg, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: sim}}
spec:
  replicas: 1
  selector: {matchLabels: {taryx.dev/role: sim, taryx.dev/sim: legacy-sg}}
  template:
    metadata: {labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: sim, taryx.dev/sim: legacy-sg}}
    spec:
      containers:
        - name: sim
          image: taryx-legacy-sim:latest
          imagePullPolicy: IfNotPresent
          env: [{name: LEGACY_DB, value: /data/legacy_calc.db}]
          ports: [{containerPort: 8090}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8090}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: legacy-sg, namespace: taryx, labels: {app.kubernetes.io/part-of: taryx}}
spec:
  selector: {taryx.dev/sim: legacy-sg}
  ports: [{port: 8090, targetPort: 8090}]
---
apiVersion: apps/v1
