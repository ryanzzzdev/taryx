# Development-only credentials — identical to compose defaults. A real
# deployment sources these from an external secrets manager.
apiVersion: v1
kind: Secret
metadata:
  name: taryx-secrets
  namespace: taryx
type: Opaque
stringData:
  # Postgres bootstrap superuser (provisioning only)
  db-super-user: taryx
  db-super-pass: taryx
  # Aurora application role (owner of its objects, non-superuser)
  aurora-db-user: taryx_app
  aurora-db-pass: taryx_app
  aurora-shadow-user: taryx_shadow
  aurora-shadow-pass: taryx_shadow
  # Southgrid application role
  sg-db-user: taryx_sg
  sg-db-pass: taryx_sg
  sg-shadow-user: taryx_shadow_sg
  sg-shadow-pass: taryx_shadow_sg
  # Broker: provisioner-only admin + per-client application users
  broker-admin-user: taryx_admin
  broker-admin-pass: taryx_admin
  aurora-amqp-url: amqp://taryx:taryx@broker:5672/taryx
  sg-amqp-url: amqp://taryx_sg:taryx_sg@broker:5672/taryx-sg
  # Market sim tokens
  aurora-market-token: taryx-market-token
  sg-market-token: taryx-market-sg-token
