apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: taryx
  labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: db}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {taryx.dev/role: db}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: db}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_DB
              value: taryx
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: db-super-user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taryx-secrets, key: db-super-pass}}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "taryx", "-d", "taryx"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
      volumes:
        - name: initdb
          configMap: {name: taryx-db-init}
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taryx
  labels: {app.kubernetes.io/part-of: taryx, taryx.dev/role: db}
spec:
  clusterIP: None
  selector: {taryx.dev/role: db}
  ports: [{port: 5432, targetPort: 5432}]
