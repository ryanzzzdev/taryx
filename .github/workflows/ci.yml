name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: taryx
          POSTGRES_USER: taryx
          POSTGRES_PASSWORD: taryx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taryx -d taryx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check src tests manage.py && uv run ruff format --check src tests manage.py
      - run: uv run mypy src
      - run: ./scripts/check-import-boundaries.sh
      - run: uv run pytest -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
